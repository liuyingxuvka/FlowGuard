[flowguard]
repository = "https://github.com/liuyingxuvka/FlowGuard"
adopted_package_version = "0.69.8"
schema_version = "1.0"
last_verified_at = "2026-09-20T07:52:46+00:00"
last_verified_by = "FlowGuard project adoption"
agents_path = "AGENTS.md"

[policy]
upgrade_when_installed_version_is_newer = true
latest_schema_first = true
upgrade_existing_artifacts_when_project_version_is_older = true
require_adoption_log = true
require_model_update_for_behavior_changes = true

[flowguard_execution]
schema = "flowguard.resource_policy.v1"
invocation_timeout_seconds = 7200
observation_timeout_seconds = 120
collection_timeout_seconds = 600
pytest_shard_timeout_seconds = 2400

[flowguard_execution.profile_timeout_seconds]
fast = 30
focused = 120
full = 900

[flowguard_execution.owner_timeout_seconds]
model_regressions_full = 1800
pytest = 6000
self_maintenance_review = 1800
skill_native_checks = 3600

