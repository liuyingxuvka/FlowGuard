# FlowGuard 兜底账本：每条记一个函数里能不抛出就结束的异常处理，键是"文件:函数:捕获的类型"。
# count 是这个函数里这种处理的处数；reason 写它做了什么、为什么可以留（不少于 8 个词）；
# rule 指向成文规矩：{ file = "文件", text = "该文件里必须出现的一句话" }，每次测试都核对这句话还在。
# 新增、数量变化、代码消失、那句话找不到，都会让 pytest 失败。rule = "旧账" 的条目由 ledger init 记下，只能减少。
# 裸 except、except Exception/BaseException、contextlib.suppress、警告过滤、finally 里的 return/break/continue
# 和可能返回真值的 __exit__ 不能新增登记：改代码。

["flowguard/__main__.py:main:KeyboardInterrupt"]
count = 1
reason = "旧账，未审：ledger init 记下时代码里已有这处兜底；改到这里时写明它做了什么、为什么可以留，并指向成文规矩"
rule = "旧账"

["flowguard/adapters/vitest/runtime.mjs:wrap.wrapped:any"]
count = 1
reason = "测试自己的真实调用出错时先记下这次调用的结果，然后在同一个函数里原样重新抛出给测试，错误不会被吞掉"
rule = { file = "AGENTS.md", text = "One route per function: when a step fails, the error reaches the caller or is reported with its text" }

