# The rules in force for FlowGuard itself (design 4.4): each a one-line summary and the owner's exact words it
# rests on, stored in .flowguard/requests/. A rule the owner replaces is deleted here; git keeps its history.

[rule.regression-role]
text = "AI review discovers problems, and FlowGuard preserves recorded requirements against regression as the software grows."
source = 'R68 "就是发现问题肯定是认真检查是靠 AI，然后你把这个长期不不退步是靠它。我本来一直就是这么想的，这就是我的想法，因为毕竟就是你可以想象我说的建模，就让 AI 去建模或者是插探针呐、啊、等等，写下来规矩，肯定是发现问题才能长期的让去它生长。这就是我所说的，让 Flowguard 模型和这个软件共同生长"'

[rule.current-rules]
text = "Make current requirements, prohibitions and their conflicts explicit."
source = 'R80 "就是我们葫芦画的不是应该是这个规则立住，就是什么东西要，什么东西不要，然后冲突矛盾等等吗？"'

[rule.efficient-use]
text = "FlowGuard avoids excessive time and token use and favors fast operation."
source = 'R75 "所以，我们还是因为对于成本、速度、token 使用，我们都是有要求，不能太过浪费，尽量是快，尽量省时间。"'

[rule.english-skill]
text = "FlowGuard skill text is written in English."
source = 'R74 "这个技能本身你用英文去做没问题吧"'

[rule.chinese-conversation]
text = "Communicate with the owner in Chinese."
source = 'R58 "你用中文跟我交流，怎么刚才又给我写了一大堆英文？"'

[rule.no-harm]
text = "FlowGuard never changes how the maintained software works: it acts only inside test runs, never in builds, the dev server or production."
source = 'R85 "咱们得保证 FlowGuard 不会影响已有软件自身的功能，不能说用 FlowGuard 维护之后，这个软件就不好用了"'

[rule.report-open-matters]
text = "In a maintained project, matters the owner has not decided stay recorded and FlowGuard reports what needs a decision; maintenance neither decides nor fixes them on the side."
source = 'R95 "就发现有冲突，可以先先留在里头。FlowGuard 软工具只要现在是报报告这边有那个需要决定的就行，好吗？"'

[rule.upgrade-consent]
text = "Rewriting a project's FlowGuard comments and files into a new release's form during an upgrade has the owner's yes."
source = 'R95 "就是你需要的过程当中把旧的版本变成新的，要主人同意的话，呃，当然当然就是要做"'

[rule.offered-choice]
text = "An option the agent offered and the owner picked is the owner's original choice and is recorded too, never attributing the agent's option text to him."
source = 'R105 "但实际上这也是人的原始选择，对不对？说实话，按我的想法，应该是一样记录的。"'

[rule.session-finish-error]
text = "FlowGuard's own error at a pytest session's finish is one red line after pytest's own summary; the run still fails, and show --last keeps the whole traceback."
source = 'R106 picked "A. 在这一个地方兜底：FlowGuard 自己出错时，项目的测试结果照常显示，后面加一行"FlowGuard 内部出错：……"，整次运行仍然算失败，不假装没事；详细报错另外能查。（推荐）"'

[rule.reviewed-legacy-handler]
text = "The ledger still refuses a new entry for a broad handler (except Exception/BaseException, a warning filter); a legacy entry of one may record that it was reviewed, and the ledger then counts it as reviewed instead of unreviewed."
source = 'R106 picked "B. 还是不收这种写法，但允许把审过的旧条目标成"已审"，不再一直显示"未审查"。放松最少。（推荐）"'

[rule.named-suppress]
text = "The ledger lists contextlib.suppress of named, non-broad error types as it lists except T: pass; suppress of Exception or BaseException, or of no named type, stays refused."
source = 'R106 picked "A. 第二种也收，只要写的是具体的错误类型；"什么错都接住"的写法照样不收。这是放宽，不影响已有的用法。WorldGuard 和 LogicWriting 这两个项目自己规定不许用第二种，它们的规定不变。（推荐）"'
