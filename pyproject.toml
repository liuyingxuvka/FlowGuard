[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flowguard"
version = "0.70.10"
description = "A living, code-anchored map of your software, executable models of its risky flows, and focused capability reviews for AI-assisted development."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "setuptools>=61"]

[project.scripts]
flowguard = "flowguard.__main__:main"

[tool.setuptools.packages.find]
# Teaching examples stay in the repository, not in site-packages.
include = ["flowguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["build", "work", "worktrees"]
markers = [
  "flowguard_capability(name): classify a capability-boundary regression test.",
]
