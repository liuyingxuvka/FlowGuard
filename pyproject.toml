[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flowguard"
version = "0.72.0"
description = "A living model tree of your software: a code-anchored map, executable models bound to code and tests, and a current/target model for planned changes."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "setuptools>=61"]

[project.scripts]
flowguard = "flowguard.__main__:main"

[tool.setuptools.packages.find]
# Teaching examples, the pilot engine and unpassed-slice code stay in the repository, not in site-packages.
include = ["flowguard*"]
exclude = ["flowguard.behave", "flowguard.behave.*", "flowguard._next", "flowguard._next.*"]

# A file list left by an earlier editable install would otherwise ship their sources as package data.
[tool.setuptools.exclude-package-data]
flowguard = ["behave/*", "_next/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["build", "work", "worktrees"]
