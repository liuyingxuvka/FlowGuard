[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flowguard"
version = "3.0.0"
description = "Find existing decisions and check necessary copies against one executable rule."
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0", "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-javascript>=0.25,<0.26", "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-c>=0.24,<0.25", "tree-sitter-cpp>=0.23,<0.24",
    "tree-sitter-c-sharp>=0.23,<0.24",
]

[project.optional-dependencies]
dev = ["setuptools>=61", "wheel"]

[project.scripts]
flowguard = "flowguard.__main__:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["flowguard*"]
exclude = ["flowguard.flow", "flowguard.flow.*", "flowguard.native", "flowguard.native.*",
           "flowguard.behave", "flowguard.behave.*", "flowguard._next", "flowguard._next.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["build", "work", "worktrees"]
addopts = "-p flowguard.intent.plugin"

[tool.flowguard]
authority_docs = ["docs/intent-contracts.md"]
