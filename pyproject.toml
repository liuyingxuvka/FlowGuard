[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flowguard"
version = "0.74.0"
description = "A living model tree of your software: a code-anchored map, executable models bound to code and tests, and a current/target model for planned changes."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "setuptools>=61"]

[project.scripts]
flowguard = "flowguard.__main__:main"

[tool.setuptools.packages.find]
# Teaching examples, the pilot engine and unpassed-slice code (flowguard/_next/) stay in the repository,
# not in site-packages.
include = ["flowguard*"]
exclude = ["flowguard.behave", "flowguard.behave.*", "flowguard._next", "flowguard._next.*"]

# Files of the flow-model engine that are not Python: the picture renderer, the vendored Mermaid
# with its licence, and the one-page guide to writing flow models.
[tool.setuptools.package-data]
"flowguard.flow" = ["HOWTO.md", "render.js", "vendor/mermaid.min.js", "vendor/MERMAID-LICENSE"]

# A file list left by an earlier editable install would otherwise ship their sources as package data.
[tool.setuptools.exclude-package-data]
flowguard = ["behave/*", "_next/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["build", "work", "worktrees"]
