schema_version: flowguard.validation_owner_plan.v1
change_id: optimize-agent-token-efficiency
source_state: frozen_after_focused_validation
claim_boundary: >
  One release-facing composition owns every heavy execution. Child artifacts
  prove only their declared scope; release confidence requires all eight
  required children plus post-publication identity checks.
owners:
  focused_implementation:
    owner_id: owner:token-efficiency-focused
    status: passed
    commands:
      - python .flowguard/guidance_compression/run_checks.py
      - python .flowguard/existing_model_preflight/run_checks.py
      - python .flowguard/work_context/run_checks.py
      - python .flowguard/test_evidence_mesh/run_checks.py
      - python -m pytest <affected token-efficiency tests> -q
      - python scripts/check_prompt_budgets.py --root .
      - openspec validate optimize-agent-token-efficiency --strict
  final_release_composition:
    owner_id: owner:flowguard-v0.63.0-unified-validation
    execute_once: true
    command: >
      python scripts/check_flowguard_skill_suite.py --scope full --root .
      --skillguard all --shadow-root <frozen-author-shadow>
      --installed-root <global-consumer-root> --model-jobs 1
      --model-timeout 900 --output-dir <immutable-evidence-root> --json
    child_owner_ids:
      - project_audit
      - skill_suite_static
      - skill_self_governance
      - model_regressions_full
      - pytest
      - openspec_strict
      - distribution_check
      - distribution_parity
synchronization_domains:
  - authoritative_source
  - installed_python_package
  - global_consumer_skills
  - local_git_main
  - remote_git_main
  - immutable_tag
  - github_release
reuse_policy: >
  Reuse only exact immutable terminal producer receipts with matching execution
  owner and command, source, artifact, dependency, environment, result, and
  coverage-scope fingerprints.
