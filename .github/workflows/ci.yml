name: FlowGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and self-map (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FlowGuard
        run: python -m pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest -q

      - name: FlowGuard release gate on its own map and models
        run: python -m flowguard release

      - name: Skill installs cleanly
        run: |
          python scripts/install_skill.py --target "${{ runner.temp }}/skills"
          python scripts/install_skill.py --target "${{ runner.temp }}/skills" --check
