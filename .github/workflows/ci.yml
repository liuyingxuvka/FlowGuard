name: FlowGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_deep_checks:
        description: "Run full unit and aggregate FlowGuard model regression checks"
        required: false
        default: "true"
  schedule:
    - cron: "17 4 * * 1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  fast-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1.7.0

      - name: Install FlowGuard
        run: python -m pip install -e ".[dev]"

      - name: Install FlowGuard consumer skills
        run: python scripts/install_flowguard_skills.py install --source . --json

      - name: Verify compact public dispatcher
        run: python -m flowguard --help

      - name: Verify generated consumer authority
        run: python scripts/compile_flowguard_consumer_suite_authority.py --check --json

      - name: OpenSpec strict validation
        run: openspec validate --all --strict

      - name: Current compact lifecycle tests
        run: python -m pytest -q tests/test_evidence_receipts.py tests/test_consumer_current_lifecycle.py tests/test_current_public_behavior_manifest.py

  deep-checks:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_deep_checks == 'true')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1.7.0

      - name: Install FlowGuard
        run: python -m pip install -e ".[dev]"

      - name: Install FlowGuard consumer skills
        run: python scripts/install_flowguard_skills.py install --source . --json

      - name: Verify compact public dispatcher
        run: python -m flowguard --help

      - name: Verify generated consumer authority
        run: python scripts/compile_flowguard_consumer_suite_authority.py --check --json

      - name: OpenSpec strict validation
        run: openspec validate --all --strict

      - name: Current compact lifecycle regression
        run: python -m pytest -q tests/test_evidence_receipts.py tests/test_consumer_current_lifecycle.py tests/test_current_public_behavior_manifest.py tests/test_release_verification.py tests/test_model_revision_owner_evidence.py
