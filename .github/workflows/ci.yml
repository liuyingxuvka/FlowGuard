name: FlowGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Complete tests (${{ matrix.os }}, py${{ matrix.python }}, shard ${{ matrix.shard }}/${{ matrix.shard_count }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON('[{"os":"ubuntu-latest","python":"3.11","shard":1,"shard_count":6},{"os":"ubuntu-latest","python":"3.11","shard":2,"shard_count":6},{"os":"ubuntu-latest","python":"3.11","shard":3,"shard_count":6},{"os":"ubuntu-latest","python":"3.11","shard":4,"shard_count":6},{"os":"ubuntu-latest","python":"3.11","shard":5,"shard_count":6},{"os":"ubuntu-latest","python":"3.11","shard":6,"shard_count":6},{"os":"ubuntu-latest","python":"3.13","shard":1,"shard_count":6},{"os":"ubuntu-latest","python":"3.13","shard":2,"shard_count":6},{"os":"ubuntu-latest","python":"3.13","shard":3,"shard_count":6},{"os":"ubuntu-latest","python":"3.13","shard":4,"shard_count":6},{"os":"ubuntu-latest","python":"3.13","shard":5,"shard_count":6},{"os":"ubuntu-latest","python":"3.13","shard":6,"shard_count":6},{"os":"windows-latest","python":"3.12","shard":1,"shard_count":6},{"os":"windows-latest","python":"3.12","shard":2,"shard_count":6},{"os":"windows-latest","python":"3.12","shard":3,"shard_count":6},{"os":"windows-latest","python":"3.12","shard":4,"shard_count":6},{"os":"windows-latest","python":"3.12","shard":5,"shard_count":6},{"os":"windows-latest","python":"3.12","shard":6,"shard_count":6}]') }}
    steps:
      - name: Checkout the triggering source and its history
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python outside the project
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Create a virtual environment outside the project
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          environment = Path(os.environ["RUNNER_TEMP"]) / "flowguard-ci-venv"
          subprocess.run([sys.executable, "-m", "venv", str(environment)], check=True)
          scripts = environment / ("Scripts" if os.name == "nt" else "bin")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path:
              path.write(str(scripts) + "\n")

      - name: Verify the active virtual environment before installation
        shell: python
        run: |
          import os
          from pathlib import Path
          import sys
          environment = Path(sys.prefix).resolve()
          project = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          assert sys.prefix != sys.base_prefix, "python must use a virtual environment"
          assert environment == (Path(os.environ["RUNNER_TEMP"]) / "flowguard-ci-venv").resolve(), "python must use the selected runner temporary environment"
          assert environment != project and project not in environment.parents, "virtual environment must be outside the project"
          print(f"Python: {sys.executable}\nprefix: {sys.prefix}\nbase_prefix: {sys.base_prefix}")

      - name: Install FlowGuard and its test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify the frozen source before execution
        run: python .github/scripts/ci_coverage.py identity

      - name: Complete intent and project tests through ordinary pytest
        run: python -m flowguard check --all --diagnose --shard ${{ matrix.shard }}/${{ matrix.shard_count }} --shard-report .flowguard/cache/check-shard.json

      - name: Export the original check coverage and runner identity
        run: python .github/scripts/ci_coverage.py export .flowguard/cache/check-shard.json --platform ${{ matrix.os }} --python ${{ matrix.python }} --output .ci/coverage.json

      - name: Upload this shard's coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.shard }}-of-${{ matrix.shard_count }}-${{ github.sha }}-${{ github.run_attempt }}
          path: .ci/coverage.json
          include-hidden-files: true
          if-no-files-found: error

      - name: Print the original pytest output on failure
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          output = Path(".flowguard/cache/check-output.txt")
          if output.is_file():
              print(output.read_text(encoding="utf-8", errors="replace"))

      - name: Verify the distributable skill in a temporary directory
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11' && matrix.shard == 1
        shell: python
        run: |
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile
          with tempfile.TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as temporary:
              target = str(Path(temporary) / "skills")
              subprocess.run([sys.executable, "scripts/install_skill.py", "--target", target], check=True)
              subprocess.run([sys.executable, "scripts/install_skill.py", "--target", target, "--check"], check=True)

      - name: Upload check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-diagnostics-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.shard }}-of-${{ matrix.shard_count }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .flowguard/cache/check-flow.jsonl
            .flowguard/cache/anchor-events.jsonl
            .flowguard/cache/check-output.txt
            .flowguard/cache/check-shard.json
          include-hidden-files: true
          if-no-files-found: ignore

  coverage:
    name: Complete coverage (three platforms)
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHECKS_RESULT: ${{ needs.checks.result }}
    steps:
      - name: Checkout the same source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up coverage verification Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Download only this run attempt's coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*-${{ github.sha }}-${{ github.run_attempt }}
          path: .ci/receipts
      - name: Verify all exact-source nodes and shard receipts
        run: python .github/scripts/ci_coverage.py aggregate .ci/receipts --output .ci/complete-coverage.json
      - name: Save the complete coverage summary
        uses: actions/upload-artifact@v4
        with:
          name: complete-coverage-${{ github.sha }}-${{ github.run_attempt }}
          path: .ci/complete-coverage.json
          include-hidden-files: true
          if-no-files-found: error
