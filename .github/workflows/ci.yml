name: FlowGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            full: true
          - os: ubuntu-latest
            python: "3.13"
            full: false
          - os: windows-latest
            python: "3.12"
            full: false
    steps:
      - name: Checkout the triggering source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install FlowGuard
        run: python -m pip install -e ".[dev]"

      - name: Release gate and the whole suite in 4 shards on Ubuntu Python 3.11
        if: matrix.full
        run: python -m flowguard release --shards 4

      - name: Print failed test shard diagnostics
        if: ${{ failure() && matrix.full }}
        shell: python
        run: |
          import json
          from pathlib import Path
          for path in sorted(Path(".flowguard/cache/pytest-shards").glob("run-*/aggregate.json")):
              report = json.loads(path.read_text(encoding="utf-8"))
              for shard in report.get("shards", []):
                  if shard.get("status") == "pass":
                      continue
                  print(f"Shard diagnostics: {shard.get('shard_id', shard.get('name', 'unknown'))}")
                  for key in ("stdout_path", "stderr_path"):
                      output = Path(shard[key])
                      if output.is_file():
                          print(f"--- {output.name} ---")
                          print(output.read_text(encoding="utf-8", errors="replace"))

      - name: Core path and packaging smoke on the other platforms
        if: ${{ !matrix.full }}
        run: >-
          python -m pytest -q
          tests/test_anchor_watch.py
          tests/test_change_selection.py
          tests/test_cli.py
          tests/test_cli_change.py
          tests/test_cli_main.py
          tests/test_cli_map.py
          tests/test_cli_map_check.py
          tests/test_cli_map_lint.py
          tests/test_cli_map_scan.py
          tests/test_cli_read.py
          tests/test_cli_template.py
          tests/test_component_pointer.py
          tests/test_discovery.py
          tests/test_edge_coverage.py
          tests/test_flowguard_map.py
          tests/test_flowguard_map_proof.py
          tests/test_flowguard_target.py
          tests/test_flowguard_testtree.py
          tests/test_function_selection.py
          tests/test_gap_lines.py
          tests/test_map_binding.py
          tests/test_map_check.py
          tests/test_map_discover.py
          tests/test_map_file.py
          tests/test_map_impact.py
          tests/test_map_inventory__fg_helpers.py
          tests/test_map_inventory_check.py
          tests/test_map_inventory_cli.py
          tests/test_map_inventory_common.py
          tests/test_map_inventory_discover.py
          tests/test_map_inventory_impact.py
          tests/test_map_inventory_inventory.py
          tests/test_map_inventory_mapfile.py
          tests/test_map_target.py
          tests/test_model_edits.py
          tests/test_model_proof.py
          tests/test_model_runs.py
          tests/test_model_scope.py
          tests/test_packaged_cli_surface.py
          tests/test_private_use.py
          tests/test_public_api.py
          tests/test_read_command.py
          tests/test_release_gate.py
          tests/test_release_neutral_fingerprint.py
          tests/test_requests.py
          tests/test_scan_coverage.py
          tests/test_skill_package.py
          tests/test_target_add.py
          tests/test_target_life_cycle.py
          tests/test_test_binding.py
          tests/test_test_selection.py
          tests/test_tree_resolution.py

      - name: Copy the skill and check installed files
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          target = str(Path(os.environ["RUNNER_TEMP"]) / "flowguard-skills")
          subprocess.run([sys.executable, "scripts/install_skill.py", "--target", target], check=True)
          subprocess.run([sys.executable, "scripts/install_skill.py", "--target", target, "--check"], check=True)
          PY
