name: FlowGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and self-map (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install FlowGuard
        run: python -m pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest -q

      - name: FlowGuard release gate on its own map and models
        run: python -m flowguard release

      - name: Skill installs cleanly
        run: |
          python scripts/install_skill.py --target "${{ runner.temp }}/skills"
          python scripts/install_skill.py --target "${{ runner.temp }}/skills" --check
