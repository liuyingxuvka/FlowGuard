name: FlowGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            full: true
          - os: ubuntu-latest
            python: "3.13"
            full: false
          - os: windows-latest
            python: "3.12"
            full: false
    steps:
      - name: Checkout the triggering source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install FlowGuard
        run: python -m pip install -e ".[dev]"

      - name: Complete unit suite on Ubuntu Python 3.11
        if: matrix.full
        run: python -m pytest -q

      - name: Self-map and executable models on Ubuntu Python 3.11
        if: matrix.full
        run: python -m flowguard release

      - name: Core path and packaging smoke on the other platforms
        if: ${{ !matrix.full }}
        run: >-
          python -m pytest -q
          tests/test_flowguard_map.py
          tests/test_flowguard_map_contracts.py
          tests/test_flowguard_map_proof.py
          tests/test_public_api.py
          tests/test_skill_package.py
          tests/test_packaged_cli_surface.py
          tests/test_flowguard_target.py

      - name: Copy the skill and check installed files
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          target = str(Path(os.environ["RUNNER_TEMP"]) / "flowguard-skills")
          subprocess.run([sys.executable, "scripts/install_skill.py", "--target", target], check=True)
          subprocess.run([sys.executable, "scripts/install_skill.py", "--target", target, "--check"], check=True)
          PY
