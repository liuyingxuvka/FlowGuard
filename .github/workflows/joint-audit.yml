name: FlowGuard joint audit

on:
  push:
    branches: [audit/joint-20260920]

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  native-and-wire:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout frozen audit branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install locked audit dependencies and candidate
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip==25.2"
          python -m pip install "pytest==9.0.3"
          python -m pip install -e ".[dev]"

      - name: Run declared native launcher
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "flowguard-native"
          python scripts/run_flowguard_skill_native_checks.py --root . --output-dir $output --timeout 300 --json

      - name: Verify consumer install in runner-local staging only
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "flowguard-consumer-skills"
          python scripts/install_flowguard_skills.py install --source . --target $target --json
          python scripts/install_flowguard_skills.py check --source . --target $target --json
          python scripts/install_flowguard_skills.py uninstall --target $target --json
          if (Test-Path -LiteralPath $target) {
            throw "runner-local consumer staging was not cleaned"
          }

      - name: Run wire and launcher regression tests
        shell: pwsh
        run: |
          python -m pytest -q tests/test_skill_installer.py tests/test_skill_installed_layout.py tests/test_consumer_current_lifecycle.py
