interface:
  display_name: "FlowGuard Test Mesh"
  short_description: "Govern layered test ownership and freshness"
  default_prompt: "Use $flowguard-test-mesh for route_id=test_mesh_maintenance under native_owner=test_mesh_maintenance to govern a model-derived parent/child validation inventory. Give every required test source, node, parameter case, assertion/oracle target, surface, obligation, member, cell, and shard one native owner and one executed, exact-current reused, or typed delegated disposition. Ordinary work materializes affected nodes and dependent parents; whole-target inventory is explicit-only. ProjectBlueprint embeds the exact ProjectTestInventory and every read re-audits current source. Unknown impact or ownership blocks without run-all. Keep test design separate from execution receipts: planned/not_run is never runtime pass. Read reuse, long-check, or release guidance only when triggered. Return exact denominator, freshness, deepest_proven_layer, first gap, evidence, failures, blockers, skipped_checks, residual_risk, claim_boundary, and typed_next_actions. When creating or materially changing a concrete model instance, freeze task-specific one-or-many protected failures, the candidate, native good/per-failure bad/oracle/current evidence; reusable model types are not permanently single-purpose; only declared checks may support completion claims."
