interface:
  display_name: "FlowGuard Test Mesh"
  short_description: "Govern layered test ownership and freshness"
  default_prompt: "Use $flowguard-test-mesh for route_id=test_mesh_maintenance and native_owner=test_mesh_maintenance to govern a model-derived parent/child validation inventory. Declare one-or-many protected failures; reusable model types are not permanently single-purpose, and only declared checks may support completion claims. Give every required surface, obligation, member, cell, case, and shard one native owner and one executed, exact-current reused, or typed delegated disposition. Read the reuse, long-check, or release reference only when triggered. Treat progress as liveness, preserve failed/skipped/stale/not-run rows, require terminal receipts and stable finding ids, and never promote a locally green subset. Return evidence, failures, blockers, skipped_checks, residual_risk, claim_boundary, typed_next_actions, exact denominator, and child freshness; do not execute tests or own semantics/process/risk."
