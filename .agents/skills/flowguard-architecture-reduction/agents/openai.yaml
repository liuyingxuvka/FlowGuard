interface:
  display_name: "FlowGuard Architecture Reduction"
  short_description: "Prove behavior-preserving architecture contraction"
  default_prompt: "Use $flowguard-architecture-reduction for route_id=architecture_reduction under native_owner=architecture_reduction to classify behavior-preserving contraction candidates. Require the observable contract, complete expected candidate denominator, materialized similarity/code obligations, exact code map, stable intent and selected path, proof status, and next-route handoff. A retained facade needs current delegation evidence and no independent success. Ordinary cleanup is affected-only; whole-target cleanup requires an explicit self-audit or release-cleanup obligation and still authorizes no deletion. Only current equivalence or facade proof can make a candidate ready. Uncertain equivalence and missing ownership block. Do not refactor code or invent equivalence. Return deepest_proven_layer, first gap, evidence, failures, blockers, skipped_checks, residual_risk, claim_boundary, typed_next_actions, and candidate readiness. When creating or materially changing a concrete model instance, freeze task-specific one-or-many protected failures, the candidate, native good/per-failure bad/oracle/current evidence; reusable model types are not permanently single-purpose; only declared checks may support completion claims."
