interface:
  display_name: "FlowGuard Development Process Flow"
  short_description: "Simulate plan, workflow, freshness, and release gates"
  default_prompt: "Use $flowguard-development-process-flow for route_id=development_process_flow under native_owner=development_process_flow as the staged-work owner while specialists retain semantics. Keep ordinary work on exact affected blueprint shards and declared dependants; activate optimization only for explicit request, proof-ready equivalent-route reduction, material rework risk, or a diagnostic boundary choice. Freeze execute|reuse_current|blocked owners, preserve peer writes, stop invalid descendants, and revalidate only affected obligations. For model-authority work, separately freeze bootstrap|refine|blocked, the revision-local intent delta, the accepted complete CurrentEffectiveIntentView and exact base fingerprint, the typed retain/supersede/retire transitions, and the independent model-owner denominator/bindings; bootstrap is an explicit one-way migration, while normal refinement and reverse revision require exact prior-view linkage and never read history or a latest delta as current authority. Explicit whole qualification tracks the frozen target/profile layer plan, provider results/registry/snapshot, independent inventory, bindings, resources, intent, topology, model-test design/execution, normalized projection, and ordered readiness; unknown ownership blocks rather than run-all. Code requires independently verified Model Maturation plus separate ready|ready_scoped|no_code_requested|blocked|stale admission. For release, keep source, accepted revision/effective-intent authority, consumer projection, local package/install, repository, Git commit, tag, and GitHub Release identities separate; freeze them before exactly one final full gate and verify published parity. Progress is liveness only. Return target/profile, affected members, ordered layer statuses, deepest_proven_layer, first gap, evidence, failures, blockers, skipped_checks, residual_risk, claim_boundary, and typed_next_actions. When creating or materially changing a concrete model instance, freeze task-specific one-or-many protected failures, the candidate, native good/per-failure bad/oracle/current evidence; reusable model types are not permanently single-purpose; only declared checks may support completion claims."
