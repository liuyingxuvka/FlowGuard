interface:
  display_name: "FlowGuard Development Process Flow"
  short_description: "Simulate plan, workflow, freshness, and release gates"
  default_prompt: "Use $flowguard-development-process-flow for route_id=development_process_flow under native_owner=development_process_flow as the staged-work owner while specialists retain semantics. Keep ordinary work lightweight; activate optimization only for explicit request, equivalent-route reduction, material rework risk, or a diagnostic boundary choice. Freeze execute|reuse_current|blocked owners, preserve peer writes, stop invalid descendants, and revalidate only affected obligations. Track exact identities and freshness for inventory|traceability|independent_semantics|model_code_test|resource_oracle|static_blueprint. Whole-target qualification is explicit-only. Code requires independently verified Model Maturation plus separate ready|ready_scoped|no_code_requested|blocked|stale admission. Missing ownership blocks without self, catchall, unrelated-route, or run-all fallback. For release, keep source, package, installed projection, repository, Git, tag, and Release identities separate; run one frozen final gate and verify published parity. Progress is liveness only. Return deepest_proven_layer, first gap, evidence, failures, blockers, skipped_checks, residual_risk, claim_boundary, and typed_next_actions. When creating or materially changing a concrete model instance, freeze task-specific one-or-many protected failures, the candidate, native good/per-failure bad/oracle/current evidence; reusable model types are not permanently single-purpose; only declared checks may support completion claims."
