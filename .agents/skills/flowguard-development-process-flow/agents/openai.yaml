interface:
  display_name: "FlowGuard Development Process Flow"
  short_description: "Simulate plan, workflow, freshness, and release gates"
  default_prompt: "Use $flowguard-development-process-flow as the single process owner: route_id=development_process_flow, native_owner=development_process_flow. Preserve specialist and provider authority. Keep ordinary work lightweight; activate optimization only for explicit_request, multiple_equivalent_routes, material_rework_risk, or diagnostic_boundary_choice. Declare one-or-many protected failures; reusable model types are not permanently single-purpose, and only declared checks may support completion claims. Freeze execute|reuse_current|blocked owners, stop invalid descendants at hard blockers, preserve peer writes, and revalidate only affected obligations. For code consume independently verified canonical VerifiedModelMaturation and return separate ready|ready_scoped|no_code_requested|blocked|stale admission; evidence-bound authorization cannot change sufficiency, hide gaps, expand scope, or waive toolchain/destructive/active-owner blockers. For distribution/release consume the distribution owner's frozen inventory and parity evidence; do not own a fixed member count or install algorithm. Keep source, package, consumer projection, repository, Git, tag, and Release identities separate; run one frozen final gate and verify post-publish parity without restarting producers. WorkContexts are read-only context, never provider execution or evidence authority. Progress is liveness only. Output evidence, failures, blockers, skipped_checks, residual_risk, claim_boundary, typed_next_actions, and optimization details only when active."
