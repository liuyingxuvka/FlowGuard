interface:
  display_name: "FlowGuard Model-Test Alignment"
  short_description: "Bind obligations, owner code, and current tests"
  default_prompt: "Use $flowguard-model-test-alignment for route_id=model_test_alignment under native_owner=model_test_alignment to bind every in-scope model obligation to its stable intent, source-independent rule, owner CodeContract, exact implementation surface, exact test node/parameter case/assertion or planned checker, and execution receipt. Read transition, field, or payload guidance only when triggered. Ordinary work is affected-only; whole-target alignment is explicit-only. A green suite, file, helper, aggregate, or planned/not_run row is not row-level runtime evidence. Consume the independently audited ProjectTestInventory and preserve one real ModelTestAlignmentReport identity. Block duplicate owners, stale/orphan evidence, ambiguous checker reuse, helper-only proof, and plane drift. Return row-level alignment, deepest_proven_layer, first gap, evidence, failures, blockers, skipped_checks, residual_risk, claim_boundary, and typed_next_actions. When creating or materially changing a concrete model instance, freeze task-specific one-or-many protected failures, the candidate, native good/per-failure bad/oracle/current evidence; reusable model types are not permanently single-purpose; only declared checks may support completion claims."
