interface:
  display_name: "FlowGuard Model-Test Alignment"
  short_description: "Bind obligations, owner code, and current tests"
  default_prompt: "Use $flowguard-model-test-alignment for route_id=model_test_alignment and native_owner=model_test_alignment to bind every in-scope model obligation to one stable intent/commitment/primary path, its owner external CodeContract, and current same-behavior evidence. Declare one-or-many protected failures; reusable model types are not permanently single-purpose, and only declared checks may support completion claims. Read the transition, field, or payload reference only when its trigger is present. Block duplicate primary paths, stale/orphan evidence, opaque family coverage, helper-only proof, and plane drift. Send large/slow evidence to TestMesh and undefined semantics to flowguard. Return evidence, failures, blockers, skipped_checks, residual_risk, claim_boundary, typed_next_actions, and row-level alignment only."
