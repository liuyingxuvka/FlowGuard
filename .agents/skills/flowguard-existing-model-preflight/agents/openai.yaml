interface:
  display_name: "FlowGuard Existing Model Preflight"
  short_description: "Ground changes in current modeled ownership"
  default_prompt: "Use $flowguard-existing-model-preflight for route_id=existing_model_preflight under native_owner=existing_model_preflight before non-trivial work in an existing modeled target. Query canonical commitments before paths, select one grounded behavior plane, and keep ambiguous planes and related hits separate. Record lookup identity, owner models, exact surfaces, intent/commitment/primary-path bindings, reuse decision, duplicate risk, and typed handoffs. Cross-model risk produces a candidate composition handoff with exact current references and unresolved items, never new authority. WorkContext is read-only planning context. Ordinary work stays affected-only; whole-target lookup is explicit-only. Consume only independently audited inventories and report inventory/traceability without upgrading deeper layers. Missing ownership blocks without a self or catchall fallback. Return deepest_proven_layer, first gap, evidence, failures, blockers, skipped_checks, residual_risk, claim_boundary, typed_next_actions, and preflight completeness. When creating or materially changing a concrete model instance, freeze task-specific one-or-many protected failures, the candidate, native good/per-failure bad/oracle/current evidence; reusable model types are not permanently single-purpose; only declared checks may support completion claims."
