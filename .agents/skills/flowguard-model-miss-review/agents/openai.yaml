interface:
  display_name: "FlowGuard Model Miss Review"
  short_description: "Generalize and close post-green failure classes"
  default_prompt: "Use $flowguard-model-miss-review for route_id=model_miss_review, role=public_owner, native_owner=model_miss_review; require concrete failure evidence, one affected behavior commitment, its primary owner, the exact accepted CurrentEffectiveIntentView owner binding, the blueprint gap, evidence-bound error signature, and typed related-plane context; reuse the current commitment when it covers the promise and create coverage_gap_backfill only when none does; backpropagate the supported root cause, but never infer repaired current DNA from a latest delta, history scan, root intent, word match, or code path; declare only finite current-DNA/BCL/topology relations, pass exact canonical relation and gap ids to ContractExhaustionMesh, materialize stable cases with oracles, and emit a task-bound ModelMaturation contribution; bind observed and generated cases to the owner code contract and current tests, then rerun Model-Test Alignment plus affected topology, parent, freshness, and risk replay; do not create a free sibling search, separate relation-scoring authority, point-patch closure, or cross-plane owner merge; output evidence, failures, blockers, skipped_checks, residual_risk, claim_boundary, typed_next_actions, commitment/owner/blueprint-gap ids, canonical relation/case ids, maturation status, and replay status; claim only current exact bug-class closure. When creating or materially changing a concrete model instance, freeze task-specific one-or-many protected failures, the candidate, native good/per-failure bad/oracle/current evidence; reusable model types are not permanently single-purpose; only declared checks may support completion claims."
