interface:
  display_name: "FlowGuard Model-First Kernel"
  short_description: "Route unclear work and build executable state models"
  default_prompt: "Use $flowguard for route_id=model_first_function_flow under native_owner=model_first_function_flow only when the compact route index finds no clear satellite owner. Freeze evidenced TaskFacts and the exact TaskCoverageDemand; show every owner as satisfied|not_triggered|unresolved|blocked. Build the smallest real Input x State -> Set(Output x State) model for triggered owners, with task-specific good, bad-per-protected-failure, oracle, and current evidence. Accept sufficiency only through independently verified Model Maturation; code work also requires separate DevelopmentProcessFlow admission. Ordinary work loads only the exact affected blueprint neighborhood. For an existing modeled target, current intent comes only from the accepted revision's complete CurrentEffectiveIntentView: keep its delta as history and require the independent current model-owner denominator plus exact per-owner bindings, with no latest-delta, history, word-match, root, or implementation fallback. Explicit whole-target qualification consumes one frozen profile-matching layer plan, real provider results/registry/snapshot, independent inventory, real parent-child interfaces, resources, intent, and exact per-owner test/native evidence; unsupported capability and static-versus-executed gaps stay visible. Report target/profile, affected members, ordered layer statuses, deepest_proven_layer, first gap, and gap count. Missing or ambiguous ownership blocks without a self or catchall fallback. Keep user choice, verified understanding, implementation admission, and execution evidence separate. A parent receipt cannot be relabeled as leaf evidence. RiskLedger owns confidence; target roles remain in the target model. Output evidence, failures, blockers, skipped_checks, residual_risk, claim_boundary, and typed_next_actions. When creating or materially changing a concrete model instance, freeze task-specific one-or-many protected failures, the candidate, native good/per-failure bad/oracle/current evidence; reusable model types are not permanently single-purpose; only declared checks may support completion claims."
