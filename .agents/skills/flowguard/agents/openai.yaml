interface:
  display_name: "FlowGuard"
  short_description: "Living model tree: map, executable models, tests bound to code"
  default_prompt: >-
    Use $flowguard at the start of every coding session and after every edit.
    Start with `python -m flowguard read` (the project map), look up existing
    owners with `read --find`, and open only the files of the components you
    touch. Behaviour or structure changes start as a target (`python -m
    flowguard target start`, `target check`, then `target promote` when the
    code matches). After editing run `python -m flowguard change`, fix every check
    error, run exactly the tests and models it lists, and confirm reviewed
    components. For retries, idempotency, caching, ordering, money,
    permissions or multi-step flows, write or update a target model in
    .flowguard/target/models/ with known-bad variants and conformance, using
    the same target-first flow. Never claim a
    check passed unless you ran it.
