interface:
  display_name: "FlowGuard"
  short_description: "Compare real behavior and check independent requirements"
  default_prompt: >-
    Use $flowguard with ordinary tests and read its few lines: changed outcomes, inconsistent
    same-name sensors and violated independent rules. No source change stays quiet unless a
    constraint fails. Find existing owners with `python -m flowguard show "what it decides"`.
    Connect real source anchors; write requirements independently and literal rows for genuine
    regressions. Do not model the development task. Keep context in real tests; unsafe or
    unavailable readings stay grey. Save original words once only as a rule's source, never an
    AI plan. Use optional views when useful, and report actual results.
