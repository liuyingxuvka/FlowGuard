interface:
  display_name: "FlowGuard"
  short_description: "Keep a project consistent while an AI changes it"
  default_prompt: >-
    Use $flowguard: start each task with `python -m flowguard new-task`, then run ordinary
    tests and read its block: red, then changes, leads and
    unverified. Every red and lead ends with the next step; do it, and tell the owner when it
    says so. No source change stays quiet unless a constraint fails. Find existing owners with
    `python -m flowguard show "what it decides"`; mark one owner and its same-name copies.
    Write the owner's lasting rules independently in tests/intent with their original words as
    the source. When review finds a problem, register it in the same change so FlowGuard keeps it
    from regressing. Do not model the development task. Grey is unverified, not success. Report
    actual results.
