interface:
  display_name: "FlowGuard"
  short_description: "Living code map plus executable models of risky flows"
  default_prompt: >-
    Use $flowguard at the start of every coding session and after every edit.
    Start with `python -m flowguard read` (the project map), look up existing
    owners with `read --find`, and open only the files of the components you
    touch. After editing run `python -m flowguard change`, fix every check
    error, run exactly the tests and models it lists, and confirm reviewed
    components. For retries, idempotency, caching, ordering, money,
    permissions or multi-step flows, write or update a model in
    .flowguard/models/ with known-bad variants and conformance. Never claim a
    check passed unless you ran it.
