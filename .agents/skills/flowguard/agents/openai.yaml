interface:
  display_name: "FlowGuard Model-First Kernel"
  short_description: "Route unclear work and build executable state models"
  default_prompt: "Use $flowguard for route_id=model_first_function_flow under native_owner=model_first_function_flow only when the compact route index finds no clear satellite owner. Freeze evidenced TaskFacts and the exact TaskCoverageDemand; show every owner as satisfied|not_triggered|unresolved|blocked. Build the smallest real Input x State -> Set(Output x State) model for triggered owners, with task-specific good, bad-per-protected-failure, oracle, and current evidence. Accept sufficiency only through independently verified Model Maturation; code work also requires separate DevelopmentProcessFlow admission. Ordinary work stays affected-only. An explicit whole-target blueprint uses inventory|traceability|independent_semantics|model_code_test|resource_oracle|static_blueprint, embeds the complete exact-current ProjectTestInventory, binds real portable members and parent/child interfaces, and reports deepest_proven_layer plus the first unresolved owner/member/evidence gap. Missing or ambiguous ownership blocks without a self or catchall fallback. Keep user choice, verified understanding, implementation admission, and execution evidence separate. RiskLedger owns confidence; target roles remain in the target model. Output evidence, failures, blockers, skipped_checks, residual_risk, claim_boundary, and typed_next_actions. When creating or materially changing a concrete model instance, freeze task-specific one-or-many protected failures, the candidate, native good/per-failure bad/oracle/current evidence; reusable model types are not permanently single-purpose; only declared checks may support completion claims."
