interface:
  display_name: "FlowGuard Model-Test Alignment"
  short_description: "Bind obligations, owner code, and current tests"
  default_prompt: "Use $flowguard-model-test-alignment for route_id=model_test_alignment under native_owner=model_test_alignment to bind every in-scope behavior or model obligation to its stable intent, source-independent rule, owner CodeContract, primary implementation surface, concrete case, oracle, checker design, exact test/native member, and execution owner. For an existing modeled target, resolve stable intent only through that row's exact model owner in the accepted revision's complete CurrentEffectiveIntentView; never substitute a revision delta, history fold, root intent, word match, or implementation path. Read transition, field, or payload guidance only when triggered. Report pre_code_status separately from executed_evidence_status. Ordinary work is affected-only; whole-target alignment is explicit-only. A green parent suite, file, helper, aggregate, copied receipt, or planned/not_run row is not leaf runtime evidence. Verify each passing leaf receipt's producer, subject, covered members, inputs, toolchain, environment, terminal result, and freshness; explicit cross-owner integration enumerates every owner and row. Consume the independently audited ProjectTestInventory and preserve one real ModelTestAlignmentReport identity. Block duplicate owners, stale/orphan evidence, ambiguous checker reuse, helper-only proof, and plane drift. Return row-level alignment, deepest_proven_layer, first gap, evidence, failures, blockers, skipped_checks, residual_risk, claim_boundary, and typed_next_actions. When creating or materially changing a concrete model instance, freeze task-specific one-or-many protected failures, the candidate, native good/per-failure bad/oracle/current evidence; reusable model types are not permanently single-purpose; only declared checks may support completion claims."
