interface:
  display_name: "FlowGuard Behavior Commitment Ledger"
  short_description: "Register behavior, owners, evidence, and path authority"
  default_prompt: "Use $flowguard-behavior-commitment-ledger for route_id=behavior_commitment_ledger, role=public_owner, native_owner=behavior_commitment_ledger; independently derive and freeze the exact expected source inventory from declared WorkContexts plus native UI/field inventories before reviewing the candidate ledger. Bind one bounded repository root and run the canonical live source-identity audit for every direct, anchored, semicolon-composite, or fixed-directory-prefixed glob source reference; never accept stored freshness_state=current, revision, fingerprint, or discovery evidence as proof of current files. Reject unsafe or missing refs, root-level or prefix-free globs, empty globs, missing anchors, and duplicate resolved members. Require exact expected=actual source ids, live current revision/fingerprint/discovery evidence, complete native identity/content/semantic fingerprints, and exactly one modeled/delegated/scoped disposition per source; delegation needs one specialist owner, typed relation, and current native evidence, while scope needs a bounded reason. Keep physical source identity separate from authored ownership, authority role, artifact classification, and declared semantics. Query the canonical ledger lightly, classify each modeled production row as product_runtime, agent_operation, or development_process plus actor_kind, require one active commitment and primary model owner per exact same-plane intent, typed reasoned cross-plane relations, no delegate commitments for equivalent surfaces, and one singular current-green primary_path_id for path-sensitive rows. Supporting/observed/historical sources cannot displace a declared normative target; related-plane rows are context, never merged instructions; legacy unclassified/dependency inputs are migration-only; do not replace PPA, MTA, TestMesh, or Risk Ledger. For triggered task maturation, emit exact commitment/source/path coverage and open gaps as a current typed contribution; preserve target-software actors and never declare whole-task understanding. Output evidence, failures, blockers, skipped_checks, residual_risk, claim_boundary, and typed_next_actions; broad claims remain blocked by any live inventory, ledger, or PPA gap. When creating or materially changing a concrete model instance, first freeze task/instance-specific one-or-many protected failures and the claim boundary, then bind the exact candidate plus native good, per-failure bad, oracle, and current evidence; reusable model types are not permanently single-purpose; FlowGuard owns semantics and only declared checks may support completion claims."
