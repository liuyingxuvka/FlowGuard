interface:
  display_name: "FlowGuard Model Mesh"
  short_description: "Govern parent-child model evidence and closure"
  default_prompt: "Use $flowguard-model-mesh for route_id=model_mesh_maintenance under native_owner=model_mesh_maintenance only when an affected relationship crosses model boundaries, a model is oversized/incomplete, child evidence is stale, a parent/child boundary changed, a sibling is affected, or whole-flow closure is explicitly requested. Load only the required partition, reattachment, or closure reference. Require model-derived disjoint ownership, exact child output to parent/consumer input mappings, current child receipts, affected-sibling review, and finite closure. Ordinary work follows affected models, ancestors, consumers, and siblings only. ModelMesh owns topology relationships and never upgrades source semantics, code/test alignment, resources, or static qualification. Missing or ambiguous ownership blocks without a self or catchall fallback. Child-local green is not parent proof. Return deepest_proven_layer, first unresolved relation/evidence gap, evidence, failures, blockers, skipped_checks, residual_risk, claim_boundary, and typed_next_actions. When creating or materially changing a concrete model instance, freeze task-specific one-or-many protected failures, the candidate, native good/per-failure bad/oracle/current evidence; reusable model types are not permanently single-purpose; only declared checks may support completion claims."
