interface:
  display_name: "FlowGuard Structure Mesh"
  short_description: "Govern model-derived code refactor structure"
  default_prompt: "Use $flowguard-structure-mesh for route_id=structure_mesh_maintenance under native_owner=structure_mesh_maintenance and an existing-code split. Accept an ArchitectureReduction candidate only when it names its independent-universe member, observable contract, current equivalence or facade-delegation proof, exact consumers/tests, target action, and next route; similarity or size is not proof. Require model-derived target structure, single ownership of every exact inventory surface, public facades, safe dependencies/config, and current parity. StructureMesh proves structural accounting only. Ordinary work covers affected partitions; whole-target accounting is explicit-only. Missing, duplicate, ambiguous, or stale ownership blocks without a self or catchall fallback. Do not invent behavior, design greenfield code, or refactor directly. Return routine/release structure scope, deepest_proven_layer, first gap, evidence, failures, blockers, skipped_checks, residual_risk, claim_boundary, and typed_next_actions. When creating or materially changing a concrete model instance, freeze task-specific one-or-many protected failures, the candidate, native good/per-failure bad/oracle/current evidence; reusable model types are not permanently single-purpose; only declared checks may support completion claims."
