interface:
  display_name: "FlowGuard Architecture Reduction"
  short_description: "Classify current DNA necessity and safe reduction"
  default_prompt: "Use $flowguard-architecture-reduction for route_id=architecture_reduction under native_owner=architecture_reduction to classify each in-scope architecture surface by current software-DNA necessity, not by historical existence. Ordinary work is affected-only. Open the whole universe only for an explicit self-audit or release-cleanup obligation, materialize the exact typed self-blueprint once from the current root, and independently recompute its complete build-input identity before publication instead of rebuilding the whole graph. Keep required-surface and candidate inventories independent. Derive exactly one decision for every surface and signal: retain when one exact-current needed commitment and owner prove it remains part of the current DNA; contract-equivalent when an ordinary contract action has current observable equivalence or facade-delegation proof; retire-behavior-with-complete-current-proof only when target_action=retire_behavior, proof_status=authorized_retirement, and one exact-current ArchitectureRetirementProof dispositions every commitment, behavior, model, code, test, interface, consumer, route, skill, prompt, topology relation, release claim, and negative case; otherwise unresolved. Keeping a route never implicitly keeps every internal step. Reuse the same inventory and reverse-caller index to classify each in-scope internal step as retain, merge, delegate, remove, explicit_on_demand, or unresolved; do not rescan the whole target. Merge, delegation, removal, and on-demand conversion require complete callers, equivalence or replacement evidence, and exact post-action owners for every safety/evidence responsibility; explicit_on_demand additionally requires a named trigger. Record measured operations, invocations, payload bytes, and estimated tokens only to rank review priority. High cost or low apparent value is never deletion proof, especially when the step uniquely owns safety or final evidence. Ordinary contract actions remain behavior-preserving. Historical age, prior route membership, and existing tests are not retain evidence. Retirement must preserve or transfer every still-required DNA protection and leave no alias, compatibility reader or adapter, fallback, forwarder, alternate success path, dangling current reference, or retained runtime authority; immutable history may remain archive-only. Require the exact code/caller/state/effect/error map and test/oracle obligations resolved to current inventory. Reload proof from the canonical store, derive and verify current context independently, and treat supplied verification only as an exact comparison. Proof artifact, result, and execution identities are candidate-unique and cannot be rewrapped. Do not refactor code, invent equivalence, or infer retirement from absence. Return deepest_proven_layer, first gap, evidence, failures, blockers, skipped_checks, residual_risk, claim_boundary, typed_next_actions, the four-way necessity decision, internal-step assessments, cost-priority order, candidate readiness, and retirement responsibility dispositions. When creating or materially changing a concrete model instance, freeze task-specific one-or-many protected failures, the candidate, native good/per-failure bad/oracle/current evidence; reusable model types are not permanently single-purpose; only declared checks may support completion claims."
