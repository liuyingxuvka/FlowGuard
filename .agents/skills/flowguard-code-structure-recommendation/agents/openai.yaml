interface:
  display_name: "FlowGuard Code Structure Recommendation"
  short_description: "Derive implementation ownership from a model"
  default_prompt: "Use $flowguard-code-structure-recommendation for route_id=code_structure_recommendation under native_owner=code_structure_recommendation and pre-code model-to-module design. Require a named model, exact single ownership, facade boundaries, and validation boundaries. Ordinary work covers affected elements; whole-target traceability is explicit-only and maps each model element to proposed module/symbol/owner/facade/checker plus reverse coverage obligations. The result is recommendation-only until a current DevelopmentProcessFlow admission binds every proposed path. Missing or duplicate ownership blocks without a self or catchall fallback. Do not refactor existing code or replace parity evidence. Return recommendation readiness, deepest_proven_layer, first gap, evidence, failures, blockers, skipped_checks, residual_risk, claim_boundary, and typed_next_actions. When creating or materially changing a concrete model instance, freeze task-specific one-or-many protected failures, the candidate, native good/per-failure bad/oracle/current evidence; reusable model types are not permanently single-purpose; only declared checks may support completion claims."
