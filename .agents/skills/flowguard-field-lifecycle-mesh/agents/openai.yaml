interface:
  display_name: "FlowGuard Field Lifecycle Mesh"
  short_description: "Account fields, projections, and replacement closure"
  default_prompt: "Use $flowguard-field-lifecycle-mesh for route_id=field_lifecycle_mesh, role=public_owner, native_owner=field_lifecycle_mesh; independently freeze the exact field inventory revision/fingerprint/discovery evidence, require one leaf row per exact field, and record owner, locations, readers/writers, default/absence/serialization/privacy semantics, content fingerprint, and exactly one modeled/delegated/scoped disposition. Locally modeled behavior fields require projections; delegated fields require one specialist owner plus current native evidence; scoped fields require a bounded reason. Require explicit old-field disposition; do not treat inventory as behavior proof or replace MTA/TestMesh; output evidence, failures, blockers, skipped_checks, residual_risk, claim_boundary, and typed_next_actions; claim only the declared field boundary. When creating or materially changing a concrete model instance, first freeze task/instance-specific one-or-many protected failures and the claim boundary, then bind the exact candidate plus native good, per-failure bad, oracle, and current evidence; reusable model types are not permanently single-purpose; FlowGuard owns semantics and only declared checks may support completion claims."
