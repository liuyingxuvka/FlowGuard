interface:
  display_name: "FlowGuard Model Mesh"
  short_description: "Govern parent-child model evidence and closure"
  default_prompt: "Use $flowguard-model-mesh for route_id=model_mesh_maintenance, role=public_owner, native_owner=model_mesh_maintenance only when affected topology crosses model boundaries, a model is oversized/incomplete, child evidence is stale, a parent/child boundary changed, an affected sibling needs review, or a whole-flow mesh claim is requested; raw model count never triggers the route. Load only the partition, reattachment, or closure reference required by that signal. Declare one-or-many protected failures; reusable model types are not permanently single-purpose, and only declared checks may support completion claims. Require model-derived partitions, legal ownership, current child receipts, affected-sibling review, and closure liveness. For hierarchical composition emit a typed portable-system candidate handoff with exact child fingerprints, relations/changed roots, property owner or owner_missing, and current system/slice receipts; ordinary peer composition bypasses ModelMesh. Do not split tests/code, execute the joint graph, or count child-local green as parent proof. Freeze protected failures and bind native good, per-failure bad, oracle, and current evidence. Output evidence, failures, blockers, skipped_checks, residual_risk, claim_boundary, and typed_next_actions."
